<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FontCommand 字体颜色/样式 撤销/重做测试</title>
    <script src="../dist/websheet.umd.js"></script>
    <link rel="stylesheet" href="../dist/style.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #header {
            padding: 10px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        #header h1 { margin: 0 0 6px 0; font-size: 16px; }
        #info {
            font-size: 12px; color: #666;
            padding: 4px 8px; background: #fff; border-radius: 4px;
            display: inline-block;
        }
        #container {
            width: 100%;
            height: 500px;
        }
        #logPanel {
            height: 220px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 12px;
        }
        .log-entry { margin: 2px 0; }
        .log-action { color: #569cd6; }
        .log-undo { color: #ce9178; }
        .log-redo { color: #b5cea8; }
        .log-info { color: #6a9955; }
        .log-error { color: #f44747; }
        .log-pass { color: #4ec9b0; font-weight: bold; }
        .log-fail { color: #f44747; font-weight: bold; }
        #testButtons {
            padding: 8px 20px;
            background: #fafafa;
            border-bottom: 1px solid #ddd;
        }
        #testButtons button {
            margin-right: 8px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        #testButtons button:hover { background: #e8f0fe; }
        #colWidthPanel {
            padding: 8px 20px;
            background: #f0f4ff;
            border-bottom: 1px solid #ddd;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #colWidthPanel label { font-weight: bold; color: #333; }
        #colWidthPanel .col-input-group { display: flex; align-items: center; gap: 4px; }
        #colWidthPanel input[type="number"] {
            width: 60px; padding: 2px 4px; border: 1px solid #bbb;
            border-radius: 3px; font-size: 12px; text-align: center;
        }
        #colWidthPanel input[type="range"] { width: 100px; vertical-align: middle; }
        #colWidthPanel .col-px { color: #888; font-size: 11px; min-width: 50px; }
        #colWidthPanel button {
            padding: 3px 10px; font-size: 12px; cursor: pointer;
            border: 1px solid #4a90d9; border-radius: 4px;
            background: #4a90d9; color: #fff;
        }
        #colWidthPanel button:hover { background: #357abd; }
    </style>
</head>
<body>
    <div id="header">
        <h1>FontCommand 字体颜色/样式 撤销/重做测试</h1>
        <span id="info">测试字体颜色+斜体/下划线/删除线 Command 模式：设置 → 撤销 → 重做</span>
    </div>
    <div id="colWidthPanel">
        <label>列宽控制：</label>
        <div class="col-input-group">
            <span>A列</span>
            <input type="range" id="colA_slider" min="5" max="50" value="25" step="1" oninput="onColSliderChange('A', this.value)">
            <input type="number" id="colA_input" min="5" max="50" value="25" step="1" oninput="onColInputChange('A', this.value)">
            <span class="col-px" id="colA_px">~211px</span>
        </div>
        <div class="col-input-group">
            <span>B列</span>
            <input type="range" id="colB_slider" min="5" max="50" value="15" step="1" oninput="onColSliderChange('B', this.value)">
            <input type="number" id="colB_input" min="5" max="50" value="15" step="1" oninput="onColInputChange('B', this.value)">
            <span class="col-px" id="colB_px">~127px</span>
        </div>
        <div class="col-input-group">
            <span>C列</span>
            <input type="range" id="colC_slider" min="5" max="50" value="25" step="1" oninput="onColSliderChange('C', this.value)">
            <input type="number" id="colC_input" min="5" max="50" value="25" step="1" oninput="onColInputChange('C', this.value)">
            <span class="col-px" id="colC_px">~211px</span>
        </div>
        <button onclick="applyColWidths()">应用列宽</button>
        <button onclick="resetColWidths()" style="background:#888;border-color:#888;">重置</button>
        <span style="color:#888;font-size:11px;margin-left:8px;">单位：字符宽度（1字符 ≈ 8.43px）</span>
    </div>
    <div id="testButtons">
        <button onclick="runTestSequence()">颜色测试序列</button>
        <button onclick="runStyleTestSequence()">样式测试序列</button>
        <button onclick="checkState()">检查当前状态</button>
        <button onclick="clearLog()">清空日志</button>
        <span style="font-size:12px;color:#666;margin-left:12px;">
            手动测试：选中单元格 → 工具栏操作 → Ctrl+Z 撤销 → Ctrl+Y 重做
        </span>
    </div>
    <div id="container"></div>
    <div id="logPanel"></div>

    <script>
        var logPanel = document.getElementById('logPanel');

        function log(type, msg) {
            var entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            var time = new Date().toLocaleTimeString();
            entry.textContent = '[' + time + '] ' + msg;
            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function clearLog() { logPanel.innerHTML = ''; }

        // 初始化 WebSheet
        websheet.ShowToolbar = true;
        var container = document.getElementById('container');
        var ws = new websheet('testId', container);

        var wbView = ws.getWorkBookView();
        var sheetView = wbView.getSheetView();
        var activeSheet = ws.ActiveSheet();

        // 填入测试数据
        var testData = [
            ['A1', '姓名'], ['B1', '年龄'], ['C1', '城市'],
            ['A2', '张三'], ['B2', '25'],   ['C2', '上海'],
            ['A3', '李四'], ['B3', '30'],   ['C3', '北京'],
            ['A4', '王五'], ['B4', '28'],   ['C4', '广州'],
        ];

        testData.forEach(function(item) {
            var cell = new websheet.Model.Cell();
            cell.r = item[0];
            cell.v = item[1];
            cell.s = 0;
            activeSheet.SetCellValue(item[0], cell);
        });

        // 列宽控制（与对齐测试一致）
        var colMap = { 'A': 1, 'B': 2, 'C': 3 };
        var initialWidths = { 'A': 25, 'B': 15, 'C': 25 };

        function setColWidth(colLetter, charWidth) {
            var colNum = colMap[colLetter];
            var col = new websheet.Model.Col(colNum, colNum);
            col.width = charWidth;
            col.customWidth = true;
            activeSheet.AddCol(col);
        }

        function applyColWidths() {
            var wA = parseInt(document.getElementById('colA_input').value) || 25;
            var wB = parseInt(document.getElementById('colB_input').value) || 15;
            var wC = parseInt(document.getElementById('colC_input').value) || 25;
            setColWidth('A', wA); setColWidth('B', wB); setColWidth('C', wC);
            ws.BuildSheet(); ws.Draw();
            log('info', '列宽已应用: A=' + wA + ' B=' + wB + ' C=' + wC);
        }

        function resetColWidths() {
            ['A','B','C'].forEach(function(c) {
                document.getElementById('col'+c+'_input').value = initialWidths[c];
                document.getElementById('col'+c+'_slider').value = initialWidths[c];
                updatePxLabel(c, initialWidths[c]);
            });
            applyColWidths();
        }

        function updatePxLabel(colLetter, charWidth) {
            var px = Math.ceil(charWidth * 8.43);
            document.getElementById('col' + colLetter + '_px').textContent = '~' + px + 'px';
        }

        function onColSliderChange(colLetter, value) {
            document.getElementById('col' + colLetter + '_input').value = value;
            updatePxLabel(colLetter, value);
            setColWidth(colLetter, parseInt(value));
            ws.BuildSheet(); ws.Draw();
        }

        function onColInputChange(colLetter, value) {
            var v = Math.max(5, Math.min(50, parseInt(value) || 25));
            document.getElementById('col' + colLetter + '_slider').value = v;
            updatePxLabel(colLetter, v);
            setColWidth(colLetter, v);
            ws.BuildSheet(); ws.Draw();
        }

        // 初始化列宽
        setColWidth('A', initialWidths.A);
        setColWidth('B', initialWidths.B);
        setColWidth('C', initialWidths.C);

        ws.BuildSheet();
        ws.Draw();

        log('info', 'WebSheet 初始化完成，测试数据已填入 A1:C4');
        log('info', 'Undo栈长度: ' + wbView.unDoRedo.GetUndoLength());

        // === 辅助函数 ===

        function getCellColor(addr) {
            var cell = activeSheet.GetCellByRef(addr);
            var style = activeSheet.GetCellStyleByCell(cell);
            if (!style.font || !style.font.color) return '(null)';
            if (!style.font.color.fromatSetColor) return '(not-set)';
            return style.font.color.rgb;
        }

        function doUndo() {
            wbView.unDoRedo.Undo();
            ws.BuildSheet(); ws.Draw();
        }

        function doRedo() {
            wbView.unDoRedo.Redo();
            ws.BuildSheet(); ws.Draw();
        }

        function doSetFontColor(range, hex) {
            sheetView.setActiveRange(range);
            sheetView.SetFontColor(hex);
            ws.BuildSheet(); ws.Draw();
        }

        // 获取单元格字体属性
        function getCellFontProp(addr, prop) {
            var cell = activeSheet.GetCellByRef(addr);
            var style = activeSheet.GetCellStyleByCell(cell);
            if (!style.font) return '(null)';
            var val = style.font[prop];
            if (val === null || val === undefined) return '(null)';
            if (prop === 'u') return val === 'none' ? '(none)' : val;
            if (prop === 'color') {
                if (!val.fromatSetColor) return '(not-set)';
                return val.rgb;
            }
            return val;
        }

        function doToggle(range, method) {
            sheetView.setActiveRange(range);
            sheetView[method]();
            ws.BuildSheet(); ws.Draw();
        }

        function assert(condition, msg) {
            if (condition) {
                log('pass', '  PASS ' + msg);
            } else {
                log('fail', '  FAIL ' + msg);
            }
        }

        function checkState() {
            log('info', '=== 当前状态 ===');
            log('info', 'Undo栈=' + wbView.unDoRedo.GetUndoLength() +
                ' Redo栈=' + wbView.unDoRedo.GetRedoLengt());
            var addrs = ['A1','B1','C1','A2','B2','C2','A3','B3','C3'];
            addrs.forEach(function(addr) {
                log('info', '  ' + addr +
                    ' color=' + getCellColor(addr) +
                    ' b=' + getCellFontProp(addr, 'b') +
                    ' i=' + getCellFontProp(addr, 'i') +
                    ' u=' + getCellFontProp(addr, 'u') +
                    ' strike=' + getCellFontProp(addr, 'strike'));
            });
        }

        // === 自动测试序列 ===

        function runTestSequence() {
            clearLog();
            log('action', '====== 开始字体颜色自动测试序列 ======');

            // --- 测试 1：多单元格设置红色 ---
            log('action', '测试 1: A1:C1 设置红色 (#FF0000)');
            doSetFontColor('A1:C1', '#FF0000');
            assert(getCellColor('A1') === '#FF0000', 'A1 应为 #FF0000, 实际=' + getCellColor('A1'));
            assert(getCellColor('B1') === '#FF0000', 'B1 应为 #FF0000, 实际=' + getCellColor('B1'));
            assert(getCellColor('C1') === '#FF0000', 'C1 应为 #FF0000, 实际=' + getCellColor('C1'));
            assert(wbView.unDoRedo.GetUndoLength() === 1, 'Undo栈应为 1, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 2：不同区域设置蓝色 ---
            log('action', '测试 2: A2:C2 设置蓝色 (#0000FF)');
            doSetFontColor('A2:C2', '#0000FF');
            assert(getCellColor('A2') === '#0000FF', 'A2 应为 #0000FF, 实际=' + getCellColor('A2'));
            assert(getCellColor('B2') === '#0000FF', 'B2 应为 #0000FF, 实际=' + getCellColor('B2'));
            assert(wbView.unDoRedo.GetUndoLength() === 2, 'Undo栈应为 2, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 3：撤销蓝色 ---
            log('undo', '测试 3: 撤销（A2:C2 应恢复为 null）');
            doUndo();
            assert(getCellColor('A2') === '(null)', 'A2 应为 (null), 实际=' + getCellColor('A2'));
            assert(getCellColor('B2') === '(null)', 'B2 应为 (null), 实际=' + getCellColor('B2'));
            assert(getCellColor('A1') === '#FF0000', 'A1 应仍为 #FF0000, 实际=' + getCellColor('A1'));
            assert(wbView.unDoRedo.GetUndoLength() === 1, 'Undo栈应为 1, 实际=' + wbView.unDoRedo.GetUndoLength());
            assert(wbView.unDoRedo.GetRedoLengt() === 1, 'Redo栈应为 1, 实际=' + wbView.unDoRedo.GetRedoLengt());

            // --- 测试 4：撤销红色 ---
            log('undo', '测试 4: 再次撤销（A1:C1 应恢复为 null）');
            doUndo();
            assert(getCellColor('A1') === '(null)', 'A1 应为 (null), 实际=' + getCellColor('A1'));
            assert(getCellColor('B1') === '(null)', 'B1 应为 (null), 实际=' + getCellColor('B1'));
            assert(wbView.unDoRedo.GetUndoLength() === 0, 'Undo栈应为 0, 实际=' + wbView.unDoRedo.GetUndoLength());
            assert(wbView.unDoRedo.GetRedoLengt() === 2, 'Redo栈应为 2, 实际=' + wbView.unDoRedo.GetRedoLengt());

            // --- 测试 5：重做红色 ---
            log('redo', '测试 5: 重做（A1:C1 应恢复为 #FF0000）');
            doRedo();
            assert(getCellColor('A1') === '#FF0000', 'A1 应为 #FF0000, 实际=' + getCellColor('A1'));
            assert(getCellColor('B1') === '#FF0000', 'B1 应为 #FF0000, 实际=' + getCellColor('B1'));
            assert(wbView.unDoRedo.GetUndoLength() === 1, 'Undo栈应为 1, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 6：重做蓝色 ---
            log('redo', '测试 6: 再次重做（A2:C2 应恢复为 #0000FF）');
            doRedo();
            assert(getCellColor('A2') === '#0000FF', 'A2 应为 #0000FF, 实际=' + getCellColor('A2'));
            assert(getCellColor('B2') === '#0000FF', 'B2 应为 #0000FF, 实际=' + getCellColor('B2'));
            assert(wbView.unDoRedo.GetUndoLength() === 2, 'Undo栈应为 2, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 7：单单元格设置绿色 ---
            log('action', '测试 7: 单个单元格 B3 设置绿色 (#008000)');
            doSetFontColor('B3', '#008000');
            assert(getCellColor('B3') === '#008000', 'B3 应为 #008000, 实际=' + getCellColor('B3'));
            assert(wbView.unDoRedo.GetUndoLength() === 3, 'Undo栈应为 3, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 8：撤销单单元格 ---
            log('undo', '测试 8: 撤销（B3 应恢复为 null）');
            doUndo();
            assert(getCellColor('B3') === '(null)', 'B3 应为 (null), 实际=' + getCellColor('B3'));
            assert(getCellColor('A2') === '#0000FF', 'A2 应仍为 #0000FF, 实际=' + getCellColor('A2'));

            // --- 测试 9：连续操作后状态一致性 ---
            log('action', '测试 9: 连续设置不同颜色后撤销');
            doSetFontColor('A3:C3', '#800080');  // 紫色
            doSetFontColor('A3', '#FFA500');     // 橙色（覆盖）
            doSetFontColor('B3', '#FF00FF');     // 粉色
            assert(getCellColor('A3') === '#FFA500', 'A3 应为 #FFA500, 实际=' + getCellColor('A3'));
            assert(getCellColor('B3') === '#FF00FF', 'B3 应为 #FF00FF, 实际=' + getCellColor('B3'));
            assert(getCellColor('C3') === '#800080', 'C3 应为 #800080, 实际=' + getCellColor('C3'));

            doUndo(); // 撤销 B3 粉色
            assert(getCellColor('B3') === '(null)', 'B3 应恢复 (null), 实际=' + getCellColor('B3'));
            doUndo(); // 撤销 A3 橙色
            assert(getCellColor('A3') === '#800080', 'A3 应恢复 #800080, 实际=' + getCellColor('A3'));
            doUndo(); // 撤销 A3:C3 紫色
            assert(getCellColor('A3') === '(null)', 'A3 应恢复 (null), 实际=' + getCellColor('A3'));
            assert(getCellColor('C3') === '(null)', 'C3 应恢复 (null), 实际=' + getCellColor('C3'));

            // --- 测试 10：颜色覆盖后撤销恢复原始值 ---
            log('action', '测试 10: 颜色覆盖后撤销应恢复之前的颜色');
            doSetFontColor('A1', '#FF0000');  // 红色
            doSetFontColor('A1', '#0000FF');  // 蓝色（覆盖红色）
            assert(getCellColor('A1') === '#0000FF', 'A1 应为 #0000FF, 实际=' + getCellColor('A1'));
            doUndo(); // 撤销蓝色，应恢复红色
            assert(getCellColor('A1') === '#FF0000', 'A1 应恢复 #FF0000, 实际=' + getCellColor('A1'));
            doUndo(); // 撤销红色，应恢复 null
            assert(getCellColor('A1') === '(null)', 'A1 应恢复 (null), 实际=' + getCellColor('A1'));

            log('action', '====== 颜色测试序列结束 ======');
            log('info', '最终状态: Undo栈=' + wbView.unDoRedo.GetUndoLength() +
                ' Redo栈=' + wbView.unDoRedo.GetRedoLengt());
        }

        // === 字体样式测试序列 ===

        function runStyleTestSequence() {
            clearLog();
            log('action', '====== 开始字体样式测试序列 ======');

            // --- 测试 1：斜体 ---
            log('action', '样式测试 1: A1:C1 切换斜体');
            doToggle('A1:C1', 'ToggleItalic');
            assert(getCellFontProp('A1', 'i') === true, 'A1 i 应为 true, 实际=' + getCellFontProp('A1', 'i'));
            assert(getCellFontProp('B1', 'i') === true, 'B1 i 应为 true, 实际=' + getCellFontProp('B1', 'i'));
            assert(wbView.unDoRedo.GetUndoLength() === 1, 'Undo栈应为 1, 实际=' + wbView.unDoRedo.GetUndoLength());
            log('info', '>>> 请目视确认 A1:C1 文字显示为斜体');

            // --- 测试 2：撤销斜体 ---
            log('undo', '样式测试 2: 撤销斜体');
            doUndo();
            assert(getCellFontProp('A1', 'i') === false, 'A1 i 应为 false, 实际=' + getCellFontProp('A1', 'i'));
            log('info', '>>> 请目视确认 A1:C1 文字恢复为正常（非斜体）');

            // --- 测试 3：下划线 ---
            log('action', '样式测试 3: A2:C2 切换下划线');
            doToggle('A2:C2', 'ToggleUnderline');
            assert(getCellFontProp('A2', 'u') === 'single', 'A2 u 应为 single, 实际=' + getCellFontProp('A2', 'u'));
            assert(getCellFontProp('B2', 'u') === 'single', 'B2 u 应为 single, 实际=' + getCellFontProp('B2', 'u'));
            log('info', '>>> 请目视确认 A2:C2 文字下方有下划线');

            // --- 测试 4：撤销下划线 ---
            log('undo', '样式测试 4: 撤销下划线');
            doUndo();
            assert(getCellFontProp('A2', 'u') === '(none)', 'A2 u 应为 none, 实际=' + getCellFontProp('A2', 'u'));
            log('info', '>>> 请目视确认 A2:C2 下划线消失');

            // --- 测试 5：删除线 ---
            log('action', '样式测试 5: A3:C3 切换删除线');
            doToggle('A3:C3', 'ToggleStrikethrough');
            assert(getCellFontProp('A3', 'strike') === true, 'A3 strike 应为 true, 实际=' + getCellFontProp('A3', 'strike'));
            assert(getCellFontProp('C3', 'strike') === true, 'C3 strike 应为 true, 实际=' + getCellFontProp('C3', 'strike'));
            log('info', '>>> 请目视确认 A3:C3 文字中间有删除线');

            // --- 测试 6：撤销删除线 ---
            log('undo', '样式测试 6: 撤销删除线');
            doUndo();
            assert(getCellFontProp('A3', 'strike') === false, 'A3 strike 应为 false, 实际=' + getCellFontProp('A3', 'strike'));
            log('info', '>>> 请目视确认 A3:C3 删除线消失');

            // --- 测试 7：组合样式 ---
            log('action', '样式测试 7: A1 同时设置斜体+下划线+删除线');
            doToggle('A1', 'ToggleItalic');
            doToggle('A1', 'ToggleUnderline');
            doToggle('A1', 'ToggleStrikethrough');
            assert(getCellFontProp('A1', 'i') === true, 'A1 i 应为 true, 实际=' + getCellFontProp('A1', 'i'));
            assert(getCellFontProp('A1', 'u') === 'single', 'A1 u 应为 single, 实际=' + getCellFontProp('A1', 'u'));
            assert(getCellFontProp('A1', 'strike') === true, 'A1 strike 应为 true, 实际=' + getCellFontProp('A1', 'strike'));
            log('info', '>>> 请目视确认 A1 同时显示斜体+下划线+删除线');

            // --- 测试 8：逐步撤销组合样式 ---
            log('undo', '样式测试 8: 逐步撤销（先撤销删除线，再下划线，再斜体）');
            doUndo();
            assert(getCellFontProp('A1', 'strike') === false, 'A1 strike 应恢复 false, 实际=' + getCellFontProp('A1', 'strike'));
            assert(getCellFontProp('A1', 'i') === true, 'A1 i 应仍为 true, 实际=' + getCellFontProp('A1', 'i'));
            log('info', '>>> 请目视确认 A1 删除线消失，斜体+下划线仍在');

            doUndo();
            assert(getCellFontProp('A1', 'u') === '(none)', 'A1 u 应恢复 none, 实际=' + getCellFontProp('A1', 'u'));
            assert(getCellFontProp('A1', 'i') === true, 'A1 i 应仍为 true, 实际=' + getCellFontProp('A1', 'i'));
            log('info', '>>> 请目视确认 A1 下划线消失，斜体仍在');

            doUndo();
            assert(getCellFontProp('A1', 'i') === false, 'A1 i 应恢复 false, 实际=' + getCellFontProp('A1', 'i'));
            log('info', '>>> 请目视确认 A1 全部恢复正常');

            // --- 测试 9：重做验证 ---
            log('redo', '样式测试 9: 重做斜体');
            doRedo();
            assert(getCellFontProp('A1', 'i') === true, 'A1 i 应为 true, 实际=' + getCellFontProp('A1', 'i'));
            log('info', '>>> 请目视确认 A1 恢复斜体');

            log('action', '====== 字体样式测试序列结束 ======');
            log('info', '最终状态: Undo栈=' + wbView.unDoRedo.GetUndoLength() +
                ' Redo栈=' + wbView.unDoRedo.GetRedoLengt());
            log('info', '提示：如所有 PASS 且目视效果正确，则斜体/下划线/删除线功能正常');
        }
    </script>
