<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>两阶段渲染测试 - 边框协商</title>
    <link rel="stylesheet" href="dist/style.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #header {
            padding: 10px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        #header h1 { margin: 0 0 8px 0; font-size: 16px; }
        #status {
            font-size: 12px;
            color: #666;
            padding: 4px 8px;
            background: #fff;
            border-radius: 4px;
        }
        #yourElement {
            width: 100%;
            height: calc(100vh - 80px);
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🧪 两阶段渲染测试 - 边框协商</h1>
        <div id="status">加载中...</div>
    </div>
    <div id="yourElement"></div>
    <script src="dist/websheet.umd.js"></script>
    <script>
        // 参考 delCol.html 的 API 用法: new websheet.Model.Border() 等
        let yourElement = document.getElementById("yourElement");
        let wsheet = new websheet('HTML', yourElement, 0, 0,
            document.documentElement.clientWidth * 0.99,
            document.documentElement.clientHeight * 0.6);

        let activeSheet = wsheet.ActiveSheet();

        // 列宽
        for (let c = 1; c <= 6; c++) {
            activeSheet.setColWidth(c, 90);
        }
        // 行高
        for (let r = 1; r <= 22; r++) {
            activeSheet.setRowHeight(r, 32);
        }

        // 工具
        function getColName(n) {
            return String.fromCharCode(65 + n);
        }
        // 用 websheet.Model.BorderPr / Color / Border
        function makeBorder(style, colorStr) {
            let pr = new websheet.Model.BorderPr();
            pr.borderStyle = style;
            if (colorStr) {
                pr.color = new websheet.Model.Color(colorStr).copy();
             
                pr.color.fromatSetColor = true;
            }
            return pr;
        }
        function makeAllBorder(style, colorStr) {
            let border = new websheet.Model.Border();
            border.SetAllBorder(makeBorder(style, colorStr));
            return border;
        }

        // ===== 测试 1: 4x4 thin 网格 =====
        for (let r = 1; r <= 4; r++) {
            for (let c = 1; c <= 4; c++) {
                activeSheet.SetCellValue(getColName(c - 1) + r, getColName(c - 1) + r);
            }
        }
        activeSheet.SetCellBorders('A1:D4', makeAllBorder('thin','black'));

        // ===== 测试 2: 4x4 thick 网格 =====
        for (let r = 6; r <= 9; r++) {
            for (let c = 1; c <= 4; c++) {
                activeSheet.SetCellValue(getColName(c - 1) + r, getColName(c - 1) + r);
            }
        }
        activeSheet.SetCellBorders('A6:D9', makeAllBorder('thick','black'));

        // ===== 测试 3: 4x4 dashed 虚线 =====
        for (let r = 11; r <= 14; r++) {
            for (let c = 1; c <= 4; c++) {
                activeSheet.SetCellValue(getColName(c - 1) + r, getColName(c - 1) + r);
            }
        }
        activeSheet.SetCellBorders('A11:D14', makeAllBorder('dashed','black'));

        // ===== 测试 4: 混合 thin/thick 区域 (协商) =====
        for (let r = 16; r <= 19; r++) {
            for (let c = 1; c <= 4; c++) {
                activeSheet.SetCellValue(getColName(c - 1) + r, getColName(c - 1) + r);
            }
        }
        activeSheet.SetCellBorders('A16:D17', makeAllBorder('thin', 'red'));
        activeSheet.SetCellBorders('A18:D19', makeAllBorder('thick', 'blue'));

        // 渲染
        wsheet.BuildSheet();
        wsheet.Draw();

        document.getElementById('status').textContent =
            '✅ 两阶段渲染已启用 | 4x4 thin | 4x4 thick | 4x4 dashed | 混合 thin(thick, red/blue)';
    </script>
</body>
</html>
