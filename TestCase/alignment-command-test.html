<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AlignmentCommand 撤销/重做测试</title>
    <script src="../dist/websheet.umd.js"></script>
    <link rel="stylesheet" href="../dist/style.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #header {
            padding: 10px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        #header h1 { margin: 0 0 6px 0; font-size: 16px; }
        #info {
            font-size: 12px; color: #666;
            padding: 4px 8px; background: #fff; border-radius: 4px;
            display: inline-block;
        }
        #container {
            width: 100%;
            height: 500px;
        }
        #logPanel {
            height: 220px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 12px;
        }
        .log-entry { margin: 2px 0; }
        .log-action { color: #569cd6; }
        .log-undo { color: #ce9178; }
        .log-redo { color: #b5cea8; }
        .log-info { color: #6a9955; }
        .log-error { color: #f44747; }
        .log-pass { color: #4ec9b0; font-weight: bold; }
        .log-fail { color: #f44747; font-weight: bold; }
        #testButtons {
            padding: 8px 20px;
            background: #fafafa;
            border-bottom: 1px solid #ddd;
        }
        #testButtons button {
            margin-right: 8px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        #testButtons button:hover { background: #e8f0fe; }
        #colWidthPanel {
            padding: 8px 20px;
            background: #f0f4ff;
            border-bottom: 1px solid #ddd;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #colWidthPanel label {
            font-weight: bold;
            color: #333;
        }
        #colWidthPanel .col-input-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #colWidthPanel input[type="number"] {
            width: 60px;
            padding: 2px 4px;
            border: 1px solid #bbb;
            border-radius: 3px;
            font-size: 12px;
            text-align: center;
        }
        #colWidthPanel input[type="range"] {
            width: 100px;
            vertical-align: middle;
        }
        #colWidthPanel .col-px {
            color: #888;
            font-size: 11px;
            min-width: 50px;
        }
        #colWidthPanel button {
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #4a90d9;
            border-radius: 4px;
            background: #4a90d9;
            color: #fff;
        }
        #colWidthPanel button:hover { background: #357abd; }
    </style>
</head>
<body>
    <div id="header">
        <h1>AlignmentCommand 撤销/重做测试</h1>
        <span id="info">测试对齐操作的 Command 模式：设置对齐 → 撤销 → 重做</span>
    </div>
    <div id="colWidthPanel">
        <label>列宽控制：</label>
        <div class="col-input-group">
            <span>A列</span>
            <input type="range" id="colA_slider" min="5" max="50" value="25" step="1" oninput="onColSliderChange('A', this.value)">
            <input type="number" id="colA_input" min="5" max="50" value="25" step="1" oninput="onColInputChange('A', this.value)">
            <span class="col-px" id="colA_px">~211px</span>
        </div>
        <div class="col-input-group">
            <span>B列</span>
            <input type="range" id="colB_slider" min="5" max="50" value="15" step="1" oninput="onColSliderChange('B', this.value)">
            <input type="number" id="colB_input" min="5" max="50" value="15" step="1" oninput="onColInputChange('B', this.value)">
            <span class="col-px" id="colB_px">~127px</span>
        </div>
        <div class="col-input-group">
            <span>C列</span>
            <input type="range" id="colC_slider" min="5" max="50" value="25" step="1" oninput="onColSliderChange('C', this.value)">
            <input type="number" id="colC_input" min="5" max="50" value="25" step="1" oninput="onColInputChange('C', this.value)">
            <span class="col-px" id="colC_px">~211px</span>
        </div>
        <button onclick="applyColWidths()">应用列宽</button>
        <button onclick="resetColWidths()" style="background:#888;border-color:#888;">重置</button>
        <span style="color:#888;font-size:11px;margin-left:8px;">单位：字符宽度（1字符 ≈ 8.43px）</span>
    </div>
    <div id="testButtons">
        <button onclick="runTestSequence()">自动测试序列</button>
        <button onclick="checkState()">检查当前状态</button>
        <button onclick="clearLog()">清空日志</button>
        <span style="font-size:12px;color:#666;margin-left:12px;">
            手动测试：选中单元格 → 点击工具栏左/中/右对齐 → Ctrl+Z 撤销 → Ctrl+Y 重做
        </span>
    </div>
    <div id="container"></div>
    <div id="logPanel"></div>

    <script>
        var logPanel = document.getElementById('logPanel');

        function log(type, msg) {
            var entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            var time = new Date().toLocaleTimeString();
            entry.textContent = '[' + time + '] ' + msg;
            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function clearLog() {
            logPanel.innerHTML = '';
        }

        // 初始化 WebSheet
        websheet.ShowToolbar = true;
        var container = document.getElementById('container');
        var ws = new websheet('testId', container);

        var wbView = ws.getWorkBookView();
        var sheetView = wbView.getSheetView();
        var activeSheet = ws.ActiveSheet();

        // 填入测试数据
        var testData = [
            ['A1', '姓名'], ['B1', '年龄'], ['C1', '城市'],
            ['A2', '张三'], ['B2', '25'],   ['C2', '上海'],
            ['A3', '李四'], ['B3', '30'],   ['C3', '北京'],
            ['A4', '王五'], ['B4', '28'],   ['C4', '广州'],
        ];

        testData.forEach(function(item) {
            var cell = new websheet.Model.Cell();
            cell.r = item[0];
            cell.v = item[1];
            cell.s = 0;
            activeSheet.SetCellValue(item[0], cell);
        });

        // 设置初始列宽（字符单位，1字符 ≈ 8.43px）
        // A=25(~211px), B=15(~127px), C=25(~211px) —— 宽列让对齐效果一目了然
        var colMap = { 'A': 1, 'B': 2, 'C': 3 };
        var initialWidths = { 'A': 25, 'B': 15, 'C': 25 };

        function setColWidth(colLetter, charWidth) {
            var colNum = colMap[colLetter];
            var col = new websheet.Model.Col(colNum, colNum);
            col.width = charWidth;
            col.customWidth = true;
            activeSheet.AddCol(col);
        }

        function applyColWidths() {
            var wA = parseInt(document.getElementById('colA_input').value) || 25;
            var wB = parseInt(document.getElementById('colB_input').value) || 15;
            var wC = parseInt(document.getElementById('colC_input').value) || 25;
            setColWidth('A', wA);
            setColWidth('B', wB);
            setColWidth('C', wC);
            ws.BuildSheet();
            ws.Draw();
            log('info', '列宽已应用: A=' + wA + ' B=' + wB + ' C=' + wC);
        }

        function resetColWidths() {
            ['A','B','C'].forEach(function(c) {
                document.getElementById('col'+c+'_input').value = initialWidths[c];
                document.getElementById('col'+c+'_slider').value = initialWidths[c];
                updatePxLabel(c, initialWidths[c]);
            });
            applyColWidths();
        }

        function updatePxLabel(colLetter, charWidth) {
            var px = Math.ceil(charWidth * 8.43);
            document.getElementById('col' + colLetter + '_px').textContent = '~' + px + 'px';
        }

        function onColSliderChange(colLetter, value) {
            document.getElementById('col' + colLetter + '_input').value = value;
            updatePxLabel(colLetter, value);
            // 实时应用
            setColWidth(colLetter, parseInt(value));
            ws.BuildSheet();
            ws.Draw();
        }

        function onColInputChange(colLetter, value) {
            var v = Math.max(5, Math.min(50, parseInt(value) || 25));
            document.getElementById('col' + colLetter + '_slider').value = v;
            updatePxLabel(colLetter, v);
            // 实时应用
            setColWidth(colLetter, v);
            ws.BuildSheet();
            ws.Draw();
        }

        // 初始化列宽
        setColWidth('A', initialWidths.A);
        setColWidth('B', initialWidths.B);
        setColWidth('C', initialWidths.C);

        ws.BuildSheet();
        ws.Draw();

        log('info', 'WebSheet 初始化完成，测试数据已填入 A1:C4');
        log('info', '初始列宽: A=25(~211px) B=15(~127px) C=25(~211px)');
        log('info', 'Undo栈长度: ' + wbView.unDoRedo.GetUndoLength());

        function getCellAlignment(addr) {
            var cell = activeSheet.GetCellByRef(addr);
            var style = activeSheet.GetCellStyleByCell(cell);
            return style.alignment ? style.alignment.horizontal : '(null)';
        }

        function doUndo() {
            wbView.unDoRedo.Undo();
            ws.BuildSheet();
            ws.Draw();
        }

        function doRedo() {
            wbView.unDoRedo.Redo();
            ws.BuildSheet();
            ws.Draw();
        }

        function doAlign(range, align) {
            sheetView.setActiveRange(range);
            sheetView.SetAlign(align);
            ws.BuildSheet();
            ws.Draw();
        }

        function checkState() {
            log('info', '=== 当前状态 ===');
            log('info', 'Undo栈=' + wbView.unDoRedo.GetUndoLength() +
                ' Redo栈=' + wbView.unDoRedo.GetRedoLengt());
            var addrs = ['A1','B1','C1','A2','B2','C2','A3','B3','C3'];
            addrs.forEach(function(addr) {
                log('info', '  ' + addr + ' align=' + getCellAlignment(addr));
            });
        }

        function assert(condition, msg) {
            if (condition) {
                log('pass', '  ✅ ' + msg);
            } else {
                log('fail', '  ❌ ' + msg);
            }
        }

        function runTestSequence() {
            clearLog();
            log('action', '====== 开始自动测试序列 ======');

            // --- 测试 1：多单元格居中对齐 ---
            log('action', '测试 1: A1:C1 设置居中对齐');
            doAlign('A1:C1', 'center');
            assert(getCellAlignment('A1') === 'center', 'A1 应为 center, 实际=' + getCellAlignment('A1'));
            assert(getCellAlignment('B1') === 'center', 'B1 应为 center, 实际=' + getCellAlignment('B1'));
            assert(getCellAlignment('C1') === 'center', 'C1 应为 center, 实际=' + getCellAlignment('C1'));
            assert(wbView.unDoRedo.GetUndoLength() === 1, 'Undo栈应为 1, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 2：不同区域右对齐 ---
            log('action', '测试 2: A2:C2 设置右对齐');
            doAlign('A2:C2', 'right');
            assert(getCellAlignment('A2') === 'right', 'A2 应为 right, 实际=' + getCellAlignment('A2'));
            assert(getCellAlignment('B2') === 'right', 'B2 应为 right, 实际=' + getCellAlignment('B2'));
            assert(wbView.unDoRedo.GetUndoLength() === 2, 'Undo栈应为 2, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 3：撤销右对齐 ---
            log('undo', '测试 3: 撤销（A2:C2 应恢复为 null）');
            doUndo();
            assert(getCellAlignment('A2') === null, 'A2 应为 null, 实际=' + getCellAlignment('A2'));
            assert(getCellAlignment('B2') === null, 'B2 应为 null, 实际=' + getCellAlignment('B2'));
            assert(getCellAlignment('A1') === 'center', 'A1 应仍为 center, 实际=' + getCellAlignment('A1'));
            assert(wbView.unDoRedo.GetUndoLength() === 1, 'Undo栈应为 1, 实际=' + wbView.unDoRedo.GetUndoLength());
            assert(wbView.unDoRedo.GetRedoLengt() === 1, 'Redo栈应为 1, 实际=' + wbView.unDoRedo.GetRedoLengt());

            // --- 测试 4：撤销居中对齐 ---
            log('undo', '测试 4: 再次撤销（A1:C1 应恢复为 null）');
            doUndo();
            assert(getCellAlignment('A1') === null, 'A1 应为 null, 实际=' + getCellAlignment('A1'));
            assert(getCellAlignment('B1') === null, 'B1 应为 null, 实际=' + getCellAlignment('B1'));
            assert(wbView.unDoRedo.GetUndoLength() === 0, 'Undo栈应为 0, 实际=' + wbView.unDoRedo.GetUndoLength());
            assert(wbView.unDoRedo.GetRedoLengt() === 2, 'Redo栈应为 2, 实际=' + wbView.unDoRedo.GetRedoLengt());

            // --- 测试 5：重做居中对齐 ---
            log('redo', '测试 5: 重做（A1:C1 应恢复为 center）');
            doRedo();
            assert(getCellAlignment('A1') === 'center', 'A1 应为 center, 实际=' + getCellAlignment('A1'));
            assert(getCellAlignment('B1') === 'center', 'B1 应为 center, 实际=' + getCellAlignment('B1'));
            assert(wbView.unDoRedo.GetUndoLength() === 1, 'Undo栈应为 1, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 6：重做右对齐 ---
            log('redo', '测试 6: 再次重做（A2:C2 应恢复为 right）');
            doRedo();
            assert(getCellAlignment('A2') === 'right', 'A2 应为 right, 实际=' + getCellAlignment('A2'));
            assert(getCellAlignment('B2') === 'right', 'B2 应为 right, 实际=' + getCellAlignment('B2'));
            assert(wbView.unDoRedo.GetUndoLength() === 2, 'Undo栈应为 2, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 7：单单元格左对齐 ---
            log('action', '测试 7: 单个单元格 B3 设置左对齐');
            doAlign('B3', 'left');
            assert(getCellAlignment('B3') === 'left', 'B3 应为 left, 实际=' + getCellAlignment('B3'));
            assert(wbView.unDoRedo.GetUndoLength() === 3, 'Undo栈应为 3, 实际=' + wbView.unDoRedo.GetUndoLength());

            // --- 测试 8：撤销单单元格 ---
            log('undo', '测试 8: 撤销（B3 应恢复为 null）');
            doUndo();
            assert(getCellAlignment('B3') === null, 'B3 应为 null, 实际=' + getCellAlignment('B3'));
            assert(getCellAlignment('A2') === 'right', 'A2 应仍为 right, 实际=' + getCellAlignment('A2'));

            // --- 测试 9：连续操作后状态一致性 ---
            log('action', '测试 9: 连续设置不同对齐后撤销');
            doAlign('A3:C3', 'center');
            doAlign('A3', 'left');
            doAlign('B3', 'right');
            assert(getCellAlignment('A3') === 'left', 'A3 应为 left, 实际=' + getCellAlignment('A3'));
            assert(getCellAlignment('B3') === 'right', 'B3 应为 right, 实际=' + getCellAlignment('B3'));
            assert(getCellAlignment('C3') === 'center', 'C3 应为 center, 实际=' + getCellAlignment('C3'));

            doUndo(); // 撤销 B3 right
            assert(getCellAlignment('B3') === null, 'B3 应恢复 null, 实际=' + getCellAlignment('B3'));
            doUndo(); // 撤销 A3 left
            assert(getCellAlignment('A3') === 'center', 'A3 应恢复 center, 实际=' + getCellAlignment('A3'));
            doUndo(); // 撤销 A3:C3 center
            assert(getCellAlignment('A3') === null, 'A3 应恢复 null, 实际=' + getCellAlignment('A3'));
            assert(getCellAlignment('C3') === null, 'C3 应恢复 null, 实际=' + getCellAlignment('C3'));

            log('action', '====== 测试序列结束 ======');
            log('info', '最终状态: Undo栈=' + wbView.unDoRedo.GetUndoLength() +
                ' Redo栈=' + wbView.unDoRedo.GetRedoLengt());
        }
    </script>
</body>
</html>
